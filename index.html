let data=null,page='dashboard',authMode='login',query='',selectedDay='',month=new Date(),noteSort='updated';
const icons={dashboard:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',goals:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',notes:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/>',stats:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a8 8 0 0 0 0-6l1-1.6-2-2-1.7 1a8 8 0 0 0-3-1.2L12.8 3h-2l-.9 2.2a8 8 0 0 0-3 1.2l-1.7-1-2 2 1 1.6a8 8 0 0 0 0 6l-1 1.6 2 2 1.7-1a8 8 0 0 0 3 1.2l.9 2.2h2l.9-2.2a8 8 0 0 0 3-1.2l1.7 1 2-2z"/>'};

function date(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}const today=()=>date();function fmt(s){if(!s)return '—';let [y,m,d]=s.split('-');return `${d}/${m}/${y}`}function scheduled(g,day){return day>=g.start&&(!g.end||day<=g.end)&&g.days.split(',').includes(String(new Date(day+'T12:00:00').getDay()))}function log(g,day){return g.logs.find(x=>x.day===day)}function completed(g){return g.logs.filter(x=>x.status===1).length}function progress(g){return g.target?Math.min(100,Math.round(completed(g)/g.target*100)):0}function streak(g){let n=0,d=new Date();for(let i=0;i<3660;i++){let day=date(d);if(day<g.start)break;if(scheduled(g,day)){let l=log(g,day);if(l?.status===1)n++;else if(day!==today())break}d.setDate(d.getDate()-1)}return n}function active(g){return (!g.end||g.end>=today())&&(!g.target||completed(g)<g.target)}
const sb=window.supabase.createClient('https://hltpocwodeaqzedfupbi.supabase.co','sb_publishable_3DXyInkNBLIxVMIE7M-EqA_vpVOMdGD');
function dbcheck(result){if(result.error)throw Error(result.error.message);return result.data}
async function api(path,body){
 if(path==='signup'){let r=await sb.auth.signUp({email:body.email,password:body.password,options:{data:{name:body.name},emailRedirectTo:window.location.origin}});dbcheck(r);if(!r.data.session)throw Error('Conta criada! Confirme seu e-mail antes de entrar. O link depende da configuração de publicação.');return {ok:true}}
 if(path==='login'){dbcheck(await sb.auth.signInWithPassword({email:body.email,password:body.password}));return {ok:true}}
 if(path==='logout'){dbcheck(await sb.auth.signOut());return {ok:true}}
 const u=dbcheck(await sb.auth.getUser()).user;if(!u)throw Error('Faça login para continuar.');
 if(path==='data'){
  let profile=dbcheck(await sb.from('life_profiles').select('*').eq('user_id',u.id).maybeSingle());
  if(!profile){let name=String(u.user_metadata?.name||u.email.split('@')[0]).slice(0,80);profile=dbcheck(await sb.from('life_profiles').upsert({user_id:u.id,name},{onConflict:'user_id',ignoreDuplicates:true}).select().maybeSingle());if(!profile)profile=dbcheck(await sb.from('life_profiles').select('*').eq('user_id',u.id).single())}
  let [gr,nr,lr]=await Promise.all([sb.from('life_goals').select('*').order('id',{ascending:false}),sb.from('life_notes').select('*').order('updated',{ascending:false}),sb.from('life_logs').select('*').order('day')]);
  let goals=dbcheck(gr),notes=dbcheck(nr),logs=dbcheck(lr);goals.forEach(g=>{g.end=g.end||'';g.logs=logs.filter(l=>l.goal_id===g.id)});return {user:{name:profile.name,email:u.email,theme:profile.theme,color:profile.color},goals,notes};
 }
 if(path==='settings'){dbcheck(await sb.from('life_profiles').update({name:body.name,theme:body.theme,color:body.color}).eq('user_id',u.id));return {ok:true}}
 if(path==='goal'){
  if(!body.days.length)throw Error('Escolha pelo menos um dia da semana.');
  let v={name:body.name.trim(),description:body.description||'',category:body.category||'',color:body.color,start:body.start,end:body.end||null,target:Number(body.target)||0,days:body.days.join(',')};
  let r=body.id?await sb.from('life_goals').update(v).eq('id',body.id):await sb.from('life_goals').insert(v);dbcheck(r);return {ok:true}
 }
 if(path==='log'){let g=data?.goals.find(x=>x.id===body.id);if(!g||!scheduled(g,body.day))throw Error('Este dia não está programado para a meta.');dbcheck(await sb.from('life_logs').upsert({goal_id:body.id,day:body.day,status:body.status},{onConflict:'goal_id,day'}));return {ok:true}}
 if(path==='note'){let v={title:body.title.trim(),body:body.body||'',category:body.category||'',tags:body.tags||'',favorite:!!body.favorite,updated:new Date().toISOString()};dbcheck(body.id?await sb.from('life_notes').update(v).eq('id',body.id):await sb.from('life_notes').insert(v));return {ok:true}}
 if(path==='delete'){if(!['goal','note'].includes(body.type))throw Error('Tipo inválido.');dbcheck(await sb.from(body.type==='goal'?'life_goals':'life_notes').delete().eq('id',body.id));return {ok:true}}
 if(path==='delete-account'){dbcheck(await sb.rpc('life_delete_account'));await sb.auth.signOut();return {ok:true}}
 throw Error('Operação não disponível.');
}
async function refresh(){data=await api('data');applyTheme();render()}function applyTheme(){document.body.classList.toggle('dark',data?.user.theme==='dark');document.documentElement.style.setProperty('--accent',data?.user.color||'#6758e8')}function toast(s){$('#toast').innerHTML=`<div class="toast" role="status">${esc(s)}</div>`;setTimeout(()=>$('#toast').innerHTML='',3200)}function closeModal(){$('#modal').innerHTML=''}function modal(title,content){$('#modal').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2>${esc(title)}</h2><button class="x" aria-label="Fechar" onclick="closeModal()">×</button></div>${content}</div></div>`}
function renderAuth(){document.body.classList.remove('dark');$('#root').innerHTML=`<div class="auth"><div class="auth-side"><div class="brand"><span class="brandmark">✳</span> life hub</div><div><span class="chip">UM DIA DE CADA VEZ ✦</span><h1>Organize sua vida.<br>Floresça no seu ritmo.</h1><p>Um espaço para suas ideias, seus objetivos e tudo aquilo que importa para você.</p></div><small>Seu progresso começa aqui. ✨</small></div><div class="auth-main"><div class="auth-box"><div class="brand"><span class="brandmark">✳</span> life hub</div><h1>${authMode==='login'?'Que bom ter você aqui':'Comece sua jornada'}</h1><p class="muted">${authMode==='login'?'Entre para acessar seu espaço pessoal.':'Crie sua conta para organizar o que importa.'}</p><form class="form" onsubmit="auth(event)">${authMode==='signup'?'<label>Seu nome<input name="name" required maxlength="80" placeholder="Como podemos chamar você?"></label>':''}<label>E-mail<input type="email" name="email" required autocomplete="email" placeholder="voce@exemplo.com"></label><label>Senha<input type="password" name="password" required minlength="8" autocomplete="${authMode==='login'?'current-password':'new-password'}" placeholder="Pelo menos 8 caracteres"></label><button class="btn">${authMode==='login'?'Entrar':'Criar minha conta'} →</button></form><div class="auth-foot">${authMode==='login'?'Ainda não tem conta?':'Já possui conta?'} <button class="link" onclick="authMode=authMode==='login'?'signup':'login';renderAuth()">${authMode==='login'?'Criar conta':'Entrar'}</button></div></div></div></div>`}
async function auth(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));let b=e.target.querySelector('button');b.disabled=true;try{await api(authMode==='login'?'login':'signup',f);await refresh()}catch(x){toast(x.message);b.disabled=false;if(x.message.startsWith('Conta criada!')){authMode='login';renderAuth()}}}
function navHtml(mobile=false){return nav.map(([id,label])=>`<button class="${page===id?'active':''}" onclick="go('${id}')">${svg(id)}<span>${mobile?({'dashboard':'Início','goals':'Metas','notes':'Notas','calendar':'Agenda','stats':'Dados','settings':'Ajustes'}[id]):label}</span></button>`).join('')}
function go(p){page=p;query='';render()}function render(){if(!data)return renderAuth();let u=data.user;$('#root').innerHTML=`<div class="app"><aside class="sidebar"><div class="brand"><span class="brandmark">✳</span> life hub</div><div class="tagline">SEU ESPAÇO, SEU RITMO</div><div class="navlabel">MENU PRINCIPAL</div><nav class="nav">${navHtml()}</nav><div class="sidebar-bottom"><div class="profile"><div class="avatar">${esc(u.name[0]?.toUpperCase())}</div><div class="grow"><strong>${esc(u.name)}</strong><small>${esc(u.email)}</small></div><button class="link" onclick="logout()" title="Sair">↗</button></div></div></aside><main class="main"><div class="top"><div class="search"><span>⌕</span><input aria-label="Pesquisar" placeholder="Buscar no seu espaço..." value="${esc(query)}" oninput="search(this.value)"></div><div class="top-right"><button class="circle" onclick="go('settings')" title="Configurações">⚙</button><div class="avatar">${esc(u.name[0]?.toUpperCase())}</div></div></div><div id="view">${query?searchView():view()}</div></main><nav class="mobile-nav">${navHtml(true)}</nav></div>`}
function search(q){query=q;$('#view').innerHTML=query?searchView():view()}function searchView(){let q=query.toLocaleLowerCase(),gs=data.goals.filter(g=>[g.name,g.description,g.category].some(x=>x.toLocaleLowerCase().includes(q))),ns=data.notes.filter(n=>[n.title,n.body,n.category,n.tags].some(x=>x.toLocaleLowerCase().includes(q)));return `<div class="heading"><div><h1>Resultados da busca</h1><p>Metas e anotações que correspondem à sua pesquisa.</p></div></div><div class="columns"><section class="card panel"><div class="panel-head"><h2>Metas (${gs.length})</h2></div>${gs.map(g=>goalRow(g,false)).join('')||empty('⌕','Nenhuma meta encontrada.')}</section><section class="card panel"><div class="panel-head"><h2>Anotações (${ns.length})</h2></div>${ns.map(noteRow).join('')||empty('⌕','Nenhuma anotação encontrada.')}</section></div>`}
function empty(icon,text){return `<div class="empty"><div class="empty-icon">${icon}</div>${text}</div>`}function heading(title,sub,button=''){return `<div class="heading"><div><h1>${title}</h1><p>${sub}</p></div>${button}</div>`}function goalRow(g,mark=true){let l=log(g,today());return `<div class="goal-row"><div class="goal-symbol" style="color:${esc(g.color)}">◉</div><div class="grow" role="button" tabindex="0" onclick="goalDetail(${g.id})" onkeydown="if(event.key==='Enter')goalDetail(${g.id})"><strong>${esc(g.name)}</strong><small>${esc(g.category||'Meta pessoal')} · ${completed(g)} ${completed(g)===1?'dia concluído':'dias concluídos'}</small></div>${mark?`<button class="check ${l?.status===1?'done':''}" onclick="mark(${g.id},${l?.status===1?0:1})" title="${l?.status===1?'Marcar não realizado':'Concluir hoje'}">${l?.status===1?'✓':'○'}</button>`:`<button class="link" onclick="goalDetail(${g.id})">Abrir →</button>`}</div>`}function noteRow(n){return `<div class="note-row"><div class="goal-symbol">▤</div><div class="grow"><strong>${esc(n.title)} ${n.favorite?'★':''}</strong><small>${esc(n.category||'Sem categoria')} · ${fmt(n.updated.slice(0,10))}</small></div><button class="link" onclick="noteForm(${n.id})">Abrir →</button></div>`}
function view(){if(page==='dashboard')return dashboard();if(page==='goals')return goalsView();if(page==='notes')return notesView();if(page==='calendar')return calendarView();if(page==='stats')return statsView();return settingsView()}
function dashboard(){let gs=data.goals.filter(g=>active(g)&&scheduled(g,today())),done=gs.filter(g=>log(g,today())?.status===1).length,p=gs.length?Math.round(done/gs.length*100):0;let total=data.goals.reduce((a,g)=>a+completed(g),0),max=Math.max(0,...data.goals.map(streak));let greeting=new Date().getHours()<12?'Bom dia':new Date().getHours()<18?'Boa tarde':'Boa noite';let day=new Intl.DateTimeFormat('pt-BR',{weekday:'long',day:'numeric',month:'long'}).format(new Date());return `${heading(`${greeting}, ${esc(data.user.name.split(' ')[0])} ✨`,'Aqui está um resumo do seu espaço hoje.',`<button class="btn" onclick="goalForm()">＋ Nova meta</button>`)}<div class="banner"><div><div class="eyebrow">SEU PROGRESSO IMPORTA</div><h2>Um passo de cada vez.</h2><p>Pequenas ações hoje constroem grandes conquistas amanhã.</p></div><div class="banner-art"><span class="spark one">✦</span><div class="orb">🌱</div><span class="spark two">✧</span></div></div><div class="metrics"><div class="card metric"><div class="metric-top">METAS ATIVAS <span class="metric-icon">◎</span></div><strong>${data.goals.filter(active).length}</strong><small>Em andamento</small></div><div class="card metric"><div class="metric-top">CONCLUÍDAS HOJE <span class="metric-icon">✓</span></div><strong>${done}<span class="muted small"> / ${gs.length}</span></strong><small>Metas programadas</small></div><div class="card metric"><div class="metric-top">DIAS CONCLUÍDOS <span class="metric-icon">✦</span></div><strong>${total}</strong><small>Registros realizados</small></div><div class="card metric"><div class="metric-top">SEQUÊNCIA ATUAL <span class="metric-icon">♨</span></div><strong>${max} <span class="muted small">dias</span></strong><small>Melhor entre suas metas</small></div></div><div class="columns"><section class="card panel"><div class="panel-head"><div><h2>Seu dia, suas metas</h2><p class="muted small" style="margin-top:5px;text-transform:capitalize">${esc(day)}</p></div><button class="link" onclick="go('goals')">Ver todas →</button></div><div class="today-progress"><div class="progress"><span style="width:${p}%"></span></div><strong class="small">${p}%</strong></div>${gs.map(g=>goalRow(g)).join('')||empty('✓','Nenhuma meta programada para hoje.<br>Que tal criar uma nova meta?')}</section><section class="card panel"><div class="panel-head"><div><h2>Suas anotações</h2><p class="muted small" style="margin-top:5px">Ideias e informações recentes</p></div><button class="link" onclick="go('notes')">Ver todas →</button></div>${data.notes.slice(0,4).map(noteRow).join('')||empty('▤','Seu espaço está esperando suas ideias.<br>Crie sua primeira anotação!')}<button class="btn secondary" style="width:100%;margin-top:10px" onclick="noteForm()">＋ Nova anotação</button></section></div>`}
function goalsView(){return `${heading('Minhas metas','Cultive hábitos e acompanhe cada passo da sua jornada.',`<button class="btn" onclick="goalForm()">＋ Nova meta</button>`)}${data.goals.length?`<div class="grid">${data.goals.map(g=>`<article class="card tile" onclick="goalDetail(${g.id})"><div class="topline"><div class="goal-symbol" style="color:${esc(g.color)}">◎</div><span class="chip">${active(g)?'Em andamento':'Finalizada'}</span></div><h3>${esc(g.name)}</h3><p>${esc(g.description||'Uma meta para você seguir no seu ritmo.')}</p><div class="today-progress"><div class="progress"><span style="width:${progress(g)}%;background:${esc(g.color)}"></span></div><span class="small muted">${g.target?progress(g)+'%':completed(g)+' dias'}</span></div><small class="muted">${esc(g.category||'Pessoal')} · Início ${fmt(g.start)}</small></article>`).join('')}</div>`:`<div class="card">${empty('◎','Você ainda não criou nenhuma meta.<br>Comece com uma pequena ação diária.')}</div>`}`}
function goalForm(id){let g=data.goals.find(x=>x.id===id)||{name:'',description:'',category:'',start:today(),end:'',target:'',days:'0,1,2,3,4,5,6',color:'#6758e8'};modal(id?'Editar meta':'Criar nova meta',`<form class="form" onsubmit="saveGoal(event,${id||0})"><label>Nome da meta<input name="name" required maxlength="120" value="${esc(g.name)}" placeholder="Ex.: Ler por 15 minutos"></label><label>Descrição<textarea name="description" placeholder="Por que essa meta é importante para você?">${esc(g.description)}</textarea></label><div class="formrow"><label>Categoria<input name="category" value="${esc(g.category)}" placeholder="Ex.: Bem-estar"></label><label>Cor da meta<input type="color" name="color" value="${esc(g.color)}"></label></div><div class="formrow"><label>Data de início<input type="date" name="start" required value="${esc(g.start)}"></label><label>Data de término (opcional)<input type="date" name="end" value="${esc(g.end)}"></label></div><label>Quantidade de dias desejada (opcional)<input name="target" type="number" min="0" max="10000" value="${esc(g.target)}" placeholder="Ex.: 30"></label><label>Dias programados</label><div class="week">${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map((x,i)=>`<label><input type="checkbox" name="days" value="${i}" ${g.days.split(',').includes(''+i)?'checked':''}>${x}</label>`).join('')}</div><button class="btn">Salvar meta</button></form>`)}
async function saveGoal(e,id){e.preventDefault();let f=new FormData(e.target),d=Object.fromEntries(f);d.days=f.getAll('days').map(Number);d.id=id;try{await api('goal',d);closeModal();await refresh();toast('Meta salva com sucesso!')}catch(x){toast(x.message)}}
async function mark(id,status,day=today()){try{await api('log',{id,status,day});await refresh();toast(status?'Boa! Atividade concluída. ✨':'Registro atualizado.')}catch(x){toast(x.message)}}
function goalDetail(id){let g=data.goals.find(x=>x.id===id);if(!g)return;let l=log(g,today());modal(g.name,`<p class="muted" style="line-height:1.6">${esc(g.description||'Sua jornada, no seu ritmo.')}</p><div class="metrics" style="grid-template-columns:repeat(2,1fr);margin:22px 0"><div class="card metric"><div class="metric-top">DIAS CONCLUÍDOS</div><strong>${completed(g)}${g.target?` <span class="muted small">/ ${g.target}</span>`:''}</strong></div><div class="card metric"><div class="metric-top">SEQUÊNCIA ATUAL</div><strong>${streak(g)} <span class="small muted">dias</span></strong></div></div><p class="small muted">Início: ${fmt(g.start)} · Prazo: ${fmt(g.end)} · ${esc(g.category||'Pessoal')}</p><div class="actions" style="margin:20px 0">${scheduled(g,today())?`<button class="btn" onclick="markDetail(${id},1)">✓ Concluído hoje ${l?.status===1?'· registrado':''}</button><button class="btn secondary" onclick="markDetail(${id},0)">Não realizado ${l?.status===0?'· registrado':''}</button>`:'<span class="muted">Não programada para hoje.</span>'}</div><h3>Histórico de registros</h3><div style="max-height:180px;overflow:auto;margin:10px 0">${g.logs.slice().reverse().map(x=>`<div class="goal-row"><span>${fmt(x.day)}</span><span class="grow"></span><span class="chip">${x.status?'✓ Concluído':'Não realizado'}</span></div>`).join('')||'<p class="muted small">Nenhum registro ainda.</p>'}</div><div class="actions"><button class="btn secondary" onclick="goalForm(${id})">Editar meta</button><button class="btn danger" onclick="removeItem('goal',${id})">Excluir</button></div>`)}async function markDetail(id,status){await mark(id,status);goalDetail(id)}
function notesView(){let ns=[...data.notes].sort((a,b)=>noteSort==='created'?b.created.localeCompare(a.created):b.updated.localeCompare(a.updated));return `${heading('Anotações','Um lugar para guardar suas ideias e informações.',`<button class="btn" onclick="noteForm()">＋ Nova anotação</button>`)}<div style="margin-bottom:15px"><label class="small muted">Ordenar por: <select onchange="noteSort=this.value;render()"><option value="updated" ${noteSort==='updated'?'selected':''}>Modificação</option><option value="created" ${noteSort==='created'?'selected':''}>Criação</option></select></label></div>${ns.length?`<div class="grid">${ns.map(n=>`<article class="card tile" onclick="noteForm(${n.id})"><div class="topline"><span class="chip">${esc(n.category||'Sem categoria')}</span><span style="color:#e9b355">${n.favorite?'★':'☆'}</span></div><h3>${esc(n.title)}</h3><p>${esc(n.body.slice(0,130)||'Sem descrição')}</p><small class="muted">${esc(n.tags||'Sem etiquetas')} · ${fmt(n.updated.slice(0,10))}</small></article>`).join('')}</div>`:`<div class="card">${empty('▤','Sua biblioteca pessoal começa aqui.<br>Crie uma anotação para guardar uma ideia.')}</div>`}`}
function noteForm(id){let n=data.notes.find(x=>x.id===id)||{title:'',body:'',category:'',tags:'',favorite:0};modal(id?'Editar anotação':'Nova anotação',`<form class="form" onsubmit="saveNote(event,${id||0})"><label>Título<input name="title" required maxlength="150" value="${esc(n.title)}" placeholder="Dê um nome à sua anotação"></label><label>Conteúdo<textarea name="body" style="min-height:160px" placeholder="Escreva o que quiser guardar...">${esc(n.body)}</textarea></label><div class="formrow"><label>Categoria<input name="category" value="${esc(n.category)}" placeholder="Ex.: Ideias"></label><label>Etiquetas<input name="tags" value="${esc(n.tags)}" placeholder="Separadas por vírgula"></label></div><label style="display:flex;align-items:center"><input type="checkbox" name="favorite" ${n.favorite?'checked':''}> Favoritar anotação</label><div class="actions"><button class="btn">Salvar anotação</button>${id?`<button type="button" class="btn danger" onclick="removeItem('note',${id})">Excluir</button>`:''}</div></form>`)}async function saveNote(e,id){e.preventDefault();let f=new FormData(e.target),d=Object.fromEntries(f);d.id=id;d.favorite=f.has('favorite');try{await api('note',d);closeModal();await refresh();toast('Anotação salva!')}catch(x){toast(x.message)}}async function removeItem(type,id){if(!confirm(`Tem certeza que deseja excluir ${type==='goal'?'esta meta e seu histórico':'esta anotação'}?`))return;try{await api('delete',{type,id});closeModal();await refresh();toast('Excluído com sucesso.')}catch(x){toast(x.message)}}
function calendarView(){let y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1).getDay(),count=new Date(y,m+1,0).getDate(),label=new Intl.DateTimeFormat('pt-BR',{month:'long',year:'numeric'}).format(month);let days=Array(first).fill('<div></div>');for(let i=1;i<=count;i++){let day=date(new Date(y,m,i)),gs=data.goals.filter(g=>scheduled(g,day));days.push(`<button class="day ${day===today()?'today':''}" onclick="dayDetail('${day}')">${i}${gs.length?`<span class="dot">${gs.length} ${gs.length===1?'meta':'metas'}</span>`:''}</button>`)}return `${heading('Calendário','Visualize suas metas programadas ao longo do tempo.')}<section class="card panel"><div class="panel-head"><h2 style="text-transform:capitalize">${label}</h2><div class="actions"><button class="btn secondary" onclick="month.setMonth(month.getMonth()-1);render()">←</button><button class="btn secondary" onclick="month=new Date();render()">Hoje</button><button class="btn secondary" onclick="month.setMonth(month.getMonth()+1);render()">→</button></div></div><div class="calendar">${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(x=>`<div class="muted small" style="padding:8px">${x}</div>`).join('')}${days.join('')}</div><div class="legend">Selecione um dia para ver suas atividades.</div></section>`}
function dayDetail(day){let gs=data.goals.filter(g=>scheduled(g,day));modal('Atividades · '+fmt(day),gs.length?gs.map(g=>{let l=log(g,day);return `<div class="goal-row"><div class="goal-symbol">◎</div><div class="grow"><strong>${esc(g.name)}</strong><small>${l?(l.status?'Concluído':'Não realizado'):'Ainda não registrado'}${g.end===day?' · Prazo final':''}</small></div>${day<=today()?`<button class="check ${l?.status===1?'done':''}" onclick="markDay(${g.id},1,'${day}')" title="Concluído">✓</button><button class="check ${l?.status===0?'done':''}" onclick="markDay(${g.id},0,'${day}')" title="Não realizado">×</button>`:''}</div>`}).join(''):empty('◷','Nenhuma meta programada neste dia.'))}async function markDay(id,status,day){await mark(id,status,day);dayDetail(day)}
function statsView(){let gs=data.goals,logs=gs.flatMap(g=>g.logs),good=logs.filter(l=>l.status===1).length,rate=logs.length?Math.round(good/logs.length*100):0;return `${heading('Estatísticas','Seu progresso, visto de perto.')}<div class="metrics"><div class="card metric"><div class="metric-top">TOTAL DE METAS</div><strong>${gs.length}</strong><small>Metas criadas</small></div><div class="card metric"><div class="metric-top">EM ANDAMENTO</div><strong>${gs.filter(active).length}</strong><small>Metas ativas</small></div><div class="card metric"><div class="metric-top">REGISTROS CONCLUÍDOS</div><strong>${good}</strong><small>Atividades realizadas</small></div><div class="card metric"><div class="metric-top">TAXA DOS REGISTROS</div><strong>${rate}%</strong><small>Concluídos / registrados</small></div></div><div class="columns"><section class="card panel"><div class="panel-head"><h2>Últimos 7 dias</h2></div>${Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-(6-i));let day=date(d),all=gs.filter(g=>scheduled(g,day)),n=all.filter(g=>log(g,day)?.status===1).length,p=all.length?Math.round(n/all.length*100):0;return `<div class="barline"><label>${fmt(day).slice(0,5)}</label><div class="progress"><span style="width:${p}%"></span></div><span class="small muted">${n}/${all.length}</span></div>`}).join('')}</section><section class="card panel"><div class="panel-head"><h2>Progresso por meta</h2></div>${gs.map(g=>`<div class="barline"><label style="width:115px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(g.name)}</label><div class="progress"><span style="width:${progress(g)}%;background:${esc(g.color)}"></span></div><span class="small muted">${g.target?progress(g)+'%':completed(g)+' dias'}</span></div>`).join('')||empty('↗','Crie uma meta para acompanhar seu progresso.')}</section></div>`}
function settingsView(){let u=data.user;return `${heading('Configurações','Personalize seu espaço do seu jeito.')}<section class="card panel settings-section"><div class="panel-head"><h2>Perfil e aparência</h2></div><form class="form" onsubmit="saveSettings(event)"><label>Nome<input name="name" required maxlength="80" value="${esc(u.name)}"></label><label>E-mail<input value="${esc(u.email)}" disabled></label><div class="formrow"><label>Tema<select name="theme"><option value="light" ${u.theme==='light'?'selected':''}>Claro</option><option value="dark" ${u.theme==='dark'?'selected':''}>Escuro</option></select></label><label>Cor principal<input type="color" name="color" value="${esc(u.color)}"></label></div><div><button class="btn">Salvar alterações</button></div></form></section><section class="card panel settings-section" style="margin-top:16px"><h2>Seus dados</h2><p class="muted" style="margin:9px 0 18px">Exporte seus dados ou gerencie sua conta.</p><div class="actions"><button class="btn secondary" onclick="exportData()">↓ Exportar dados (JSON)</button><button class="btn secondary" onclick="logout()">Sair da conta</button><button class="btn danger" onclick="deleteAccount()">Excluir conta</button></div></section>`}
async function saveSettings(e){e.preventDefault();try{await api('settings',Object.fromEntries(new FormData(e.target)));await refresh();toast('Configurações salvas!')}catch(x){toast(x.message)}}function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='life-hub-dados.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function logout(){try{await api('logout',{});data=null;page='dashboard';renderAuth()}catch(x){toast(x.message)}}async function deleteAccount(){if(!confirm('Excluir sua conta e TODOS os seus dados permanentemente? Esta ação não pode ser desfeita.'))return;if(!confirm('Confirme mais uma vez: deseja apagar definitivamente sua conta?'))return;try{await api('delete-account',{});data=null;renderAuth();toast('Conta excluída.')}catch(x){toast(x.message)}}
refresh().catch(()=>renderAuth());
</script></body></html>
